[project]
name = "webuntis-cli"
version = "0.1.0"
description = "Reverse-engineering WebUntis API to automate Lehrstoff entry"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.scripts]
webuntis-cli = "webuntis_cli.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
